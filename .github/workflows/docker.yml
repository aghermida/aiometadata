name: Build and Push Docker Image

on:
  push:
    branches:
      - dev
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync fork with upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/cedya77/aiometadata.git
          git fetch upstream
          if ! git merge upstream/dev --no-edit; then
            # Files intentionally removed from this fork: if upstream keeps
            # modifying them, auto-resolve by keeping them deleted.
            conflicts=$(git diff --name-only --diff-filter=U)
            unresolved=""
            for f in $conflicts; do
              case "$f" in
                .github/workflows/docker-release.yml|.github/workflows/release-please.yml) ;;
                *) unresolved="$unresolved $f" ;;
              esac
            done
            if [ -n "$unresolved" ]; then
              git merge --abort
              echo "::error::Merge conflict syncing dev with upstream/dev in:$unresolved. Resolve manually via a PR."
              exit 1
            fi
            for f in $conflicts; do
              git rm -f "$f"
            done
            git commit --no-edit
          fi
          git push origin dev

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ghcr.io/aghermida/aiometadata:latest
