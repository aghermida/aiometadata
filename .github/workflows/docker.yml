name: Build and Push Docker Image

on:
  push:
    branches:
      - dev
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

# The sync step below fetches, merges and pushes to `dev` non-atomically.
# Without this, an overlapping schedule/push/dispatch run can race on the
# final `git push origin dev` and fail with "fetch first" (see run #99,
# 2026-08-21). Only one sync-and-build run at a time; queue the rest
# instead of dropping them.
concurrency:
  group: sync-and-build-dev
  cancel-in-progress: false

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync fork with upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/cedya77/aiometadata.git
          git fetch upstream

          # Files this fork deletes or fully replaces relative to upstream.
          # See CLAUDE.md > "Fork sync conventions" for the rule this
          # implements: upstream keeps evolving these files on its own, so a
          # plain `git merge` always hits a modify/delete conflict here —
          # that is expected, not a real conflict to investigate. Whenever
          # you delete or replace a file that still exists upstream, add its
          # path below with a one-line reason so the nightly sync survives
          # upstream's future edits to it without another firefighting PR
          # (this is what broke the sync repeatedly on 2026-08-19/21, fixed
          # in PR #12).
          FORK_DELETED_UPSTREAM_FILES=(
            ".github/workflows/docker-release.yml"  # superseded by this file's own build+push job
            ".github/workflows/release-please.yml"  # this fork does not use release-please versioning
          )

          if ! git merge upstream/dev --no-edit; then
            conflicts=$(git diff --name-only --diff-filter=U)
            unresolved=""
            for f in $conflicts; do
              known=0
              for known_f in "${FORK_DELETED_UPSTREAM_FILES[@]}"; do
                if [ "$f" = "$known_f" ]; then
                  known=1
                  break
                fi
              done
              [ "$known" -eq 0 ] && unresolved="$unresolved $f"
            done

            if [ -n "$unresolved" ]; then
              git merge --abort
              echo "::error::Merge conflict syncing dev with upstream/dev in:$unresolved. Resolve manually via a PR."
              exit 1
            fi

            for f in $conflicts; do
              git rm -f "$f"
            done
            git commit --no-edit
          fi

          git push origin dev

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ghcr.io/aghermida/aiometadata:latest
